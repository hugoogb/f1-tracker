# F1 Tracker API — nginx server block for a VPS hosting several projects.
#
# Install:
#   sudo cp deploy/nginx/f1-tracker-api.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/f1-tracker-api.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d f1-api.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# One file per project keeps the projects separable. The frontend stays on
# Vercel, so this only fronts the API; CORS_ORIGINS in .env.prod must list the
# Vercel domain because the browser calls it cross-origin.

upstream f1_tracker_api {
    # Must match API_BIND/API_PORT in .env.prod.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name f1-api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name f1-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/f1-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f1-api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/f1-tracker-api.access.log;
    error_log  /var/log/nginx/f1-tracker-api.error.log;

    location / {
        proxy_pass http://f1_tracker_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
