# F1 Tracker — production stack for the VPS.
#
# This file IS the server's compose file: the deploy workflow sends it to
# infra-setup's deploy-app.sh, which checks it against the platform's deploy
# policy (no privileged mode, no host mounts outside the app's directory, only
# the `edge`/`data` platform networks, ...) and installs it as
# /srv/apps/f1_api/docker-compose.yml. A change the policy refuses fails the
# deploy with the reason (infra-setup/scripts/deploy-policy.py).
#
# Nothing else from this repository runs on the server: the jobs that used to
# be shell scripts on the box are the `tasks` services below, run through
# deploy-app.sh by scripts/lib/vps.sh.
#
#   cd /srv/apps/f1_api
#   docker compose --env-file .env --env-file .tag up -d --wait
#
# The image is built and pushed to GHCR by CI; nothing is built on the server.
# `.tag` carries a single line, TAG=<commit sha>, which is what makes a rollback
# one `echo` and one `up`.
#
# The database is NOT here. The platform's shared PostgreSQL owns it — new-app.sh
# provisioned the `f1_api` database and wrote DATABASE_URL (through PgBouncer) and
# DIRECT_URL into .env. Backups are the platform's job too.
name: f1_api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# One image, three roles: the API, Alembic migrations and the data pipeline.
x-app-image: &app-image
  image: ${IMAGE_REPO:-ghcr.io/hugoogb/f1_api}:${TAG:-latest}
  # PgBouncer may be published on the host rather than sharing a Docker network;
  # this makes a DATABASE_URL of host.docker.internal:6432 resolve either way.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  logging: *default-logging

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in /srv/apps/f1_api/.env}
  FASTAPI_DEBUG: ${FASTAPI_DEBUG:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your Vercel/frontend origin(s)}
  # Ingest-time settings. Harmless on the API, which never reads a dataset.
  F1DB_VERSION: ${F1DB_VERSION:-latest}
  F1DB_CACHE_DIR: /app/.f1db_cache
  FASTF1_CACHE_DIR: /app/.fastf1_cache

# Schema changes and bulk ingest both go direct, bypassing PgBouncer: its
# transaction pooling cannot carry a migration, and a multi-minute ingest has no
# business holding a pooled connection. Falls back to DATABASE_URL when the
# platform did not provide a direct URL.
x-direct-env: &direct-env
  <<: *app-env
  DATABASE_URL: ${DIRECT_URL:-${DATABASE_URL}}

services:
  # Service name matches APP_NAME so `compose run --rm f1_api ...` works as the
  # platform's runbook documents.
  f1_api:
    <<: *app-image
    container_name: f1_api
    restart: unless-stopped
    environment:
      <<: *app-env
      API_WORKERS: ${API_WORKERS:-2}
    # Caddy runs as a container on the proxy network, so it reaches this by
    # service name — `reverse_proxy f1_api:8000`, not a host port. `data` stays
    # the default network so PostgreSQL and PgBouncer keep resolving.
    networks:
      - default
      - proxy
    # The host publish is not what Caddy uses; it is kept so the API can be
    # curl'd directly from the box when diagnosing whether a problem is the
    # container or the proxy in front of it.
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000'
    # Declared here as well as in the image so `up -d --wait` has an explicit
    # contract: liveness only, so a database blip cannot get a healthy container
    # killed. /api/health/db is the readiness probe the deploy checks.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}

  # --- Task services -----------------------------------------------------------
  # Behind a profile so `up` never starts them; each runs with `compose run --rm`
  # through deploy-app.sh. The deploy runs `migrate` itself, before anything
  # restarts. scripts/vps-ingest.sh runs `ingest` and `job`; scripts/fastf1-sync.sh
  # and scripts/db-backup.sh run `job` and `backup`.

  migrate:
    <<: *app-image
    profiles: ['tasks']
    restart: 'no'
    environment: *direct-env
    command: ['alembic', 'upgrade', 'head']

  ingest:
    <<: *app-image
    profiles: ['tasks']
    restart: 'no'
    environment: *direct-env
    entrypoint: ['/usr/bin/tini', '--', 'python', 'scripts/seed.py']
    # The f1db ingestors upsert the whole dataset from one release download, so
    # this both bootstraps an empty database and updates a populated one. Backup
    # and restore are skipped: those shell out to the Docker CLI, which this
    # container deliberately does not have.
    command:
      [
        '--base',
        '--layouts',
        '--colors',
        '--lineages',
        '--results',
        '--qualifying',
        '--sprints',
        '--standings',
        '--pitstops',
        '--postprocess',
        '--current-year',
        '--no-restore',
        '--no-backup',
      ]
    volumes:
      - f1dbcache:/app/.f1db_cache
      - fastf1cache:/app/.fastf1_cache

  # One command per call, inside the app image -- the calendar check, the
  # validation, the Fast-F1 status and import, the cache purge:
  #   vps_task job python scripts/should_ingest.py --days 3 --exit-code
  #   vps_task job bash scripts/purge_cache.sh --latest
  # No default command on purpose: it does what the caller names, and only
  # inside this container. REVALIDATE_* are for scripts/purge_cache.sh.
  job:
    <<: *app-image
    profiles: ['tasks']
    restart: 'no'
    environment:
      <<: *direct-env
      REVALIDATE_URL: ${REVALIDATE_URL:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    entrypoint: ['/usr/bin/tini', '--']
    volumes:
      - f1dbcache:/app/.f1db_cache
      - fastf1cache:/app/.fastf1_cache

  # The whole production database as gzipped SQL on stdout -- the only place the
  # Fast-F1 data can be dumped from, since payloads are imported straight into
  # production. `pnpm db:backup:prod` streams it to docker/backups/.
  #
  # pg_dump refuses to dump a server of a newer MAJOR version than itself, so
  # this image's major must match the platform's Postgres (infra-setup's
  # data/docker-compose.yml). Bump the two together.
  backup:
    image: postgres:17.11-alpine
    profiles: ['tasks']
    restart: 'no'
    logging: *default-logging
    environment:
      DUMP_URL: ${DIRECT_URL:-${DATABASE_URL}}
      PGCONNECT_TIMEOUT: '30'
    entrypoint:
      - sh
      - -c
      # pipefail: without it a pg_dump that dies halfway still exits 0 through
      # gzip, and a truncated dump looks like a good one.
      - set -o pipefail; pg_dump --dbname="$$DUMP_URL" --format=plain --no-owner --no-privileges --clean --if-exists | gzip -9

volumes:
  f1dbcache:
    name: f1_api_f1db_cache
  fastf1cache:
    name: f1_api_fastf1_cache
networks:
  # PostgreSQL and PgBouncer are containers on `data`, a network this stack does
  # not create, so joining it is what makes those hostnames resolve from inside
  # the container. This is the app's default network, so every service here
  # lands on it.
  #
  # Override only for a box that names it something else:
  #   docker inspect -f '{{range $$k, $$v := .NetworkSettings.Networks}}{{$$k}} {{end}}' postgres
  default:
    name: ${SHARED_NETWORK:-data}
    external: true
  # Caddy's network. Only the API joins it — migrate and ingest never serve
  # traffic, so they stay off the edge entirely.
  proxy:
    name: ${PROXY_NETWORK:-edge}
    external: true
