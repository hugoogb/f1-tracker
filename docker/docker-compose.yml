# Local development database.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# The compose project is named explicitly so the container is `f1-tracker-db`
# rather than the directory-derived `docker-db-1`, which is what scripts/lib/db.sh
# resolves. Production is unrelated to this file: the VPS uses the platform's
# shared PostgreSQL.
name: ${STACK_NAME:-f1-tracker}

services:
  db:
    # Matches the major version of the platform's shared PostgreSQL on the VPS.
    # Not cosmetic: a dump is only guaranteed to load into a server of the same
    # or a later version, and docker/backups/latest.sql.gz is taken from
    # production — a 17 dump meets syntax a 16 server rejects outright
    # (`SET transaction_timeout`, new in 17). Bump this when the platform does.
    image: postgres:17-alpine
    container_name: ${STACK_NAME:-f1-tracker}-db
    restart: unless-stopped
    labels:
      com.f1tracker.stack: ${STACK_NAME:-f1-tracker}
      com.f1tracker.managed-by: docker-compose
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1tracker}
      POSTGRES_USER: ${POSTGRES_USER:-f1tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1tracker_dev}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
    name: ${STACK_NAME:-f1-tracker}_dev_pgdata
