# Weekly F1 data ingest.
#
# The database is only reachable from the VPS, so the work happens there: this
# joins the tailnet and runs scripts/vps-ingest.sh, which sequences task
# containers on the box through infra-setup's deploy-app.sh. Same credentials and
# same SSH path as deploy.yml -- see its header for the secrets and why there is
# no SSH key.
#
# This covers the f1db dataset only. Lap times and qualifying sector times come
# from Fast-F1, which refuses both this runner and the server, so they are
# fetched by hand (`pnpm fastf1`); the last step here reports how many
# races are waiting.
#
# vps-ingest.sh applies its own calendar gate (skip unless a race ran in the last 3
# days), so this schedule can be dumb: it fires every Monday and most weeks does
# nothing. GitHub's scheduled runs drift by minutes to hours under load, which
# does not matter for a weekly job with a 3-day window.
#
# Scheduled workflows only run on the default branch.
name: ingest

on:
  schedule:
    # Mondays 06:00 UTC — after Sunday races, with time for the data to settle.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the calendar gate'
        type: boolean
        required: false
        default: true
      flags:
        description: 'seed.py flags (blank = the default current-year update)'
        required: false
        default: ''

# Never two ingests at once: they would fight over the same rows, and the f1db
# download and Fast-F1 cache are shared volumes.
concurrency:
  group: ingest-f1_api
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The Tailscale OAuth secrets live in the `vps` environment, not the
    # repository, and that environment only releases them to runs on master.
    # A workflow edited on a branch and started with workflow_dispatch gets
    # nothing to join the tailnet with.
    environment: vps
    # A full historical load takes minutes; a Fast-F1 backfill can take hours,
    # and is throttled to ~45s per session.
    timeout-minutes: 360

    steps:
      # vps-ingest.sh and scripts/lib/vps.sh come from the checkout; nothing is
      # copied to the server.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The tailscale action exits 0 even when every join attempt failed, which
      # would otherwise surface as an SSH timeout that says nothing useful.
      - name: Verify the tailnet join
        run: |
          if ! tailscale status; then
            echo "::error::Not on the tailnet, so the ingest cannot reach the" \
                 "server. Check TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET, that the" \
                 "OAuth client carries the auth_keys scope, and that it owns" \
                 "tag:ci — which must also exist in the policy file's tagOwners."
            exit 1
          fi

      # vps-ingest.sh ends by purging the Vercel cache. A failed purge does not
      # fail this step (the data is in), but purge_cache.sh prints a `::warning::`
      # workflow command, which Actions picks up from the ssh output and shows as
      # an annotation on the run — so an unset or mismatched REVALIDATE_SECRET is
      # visible here rather than as pages that quietly stay a day behind.
      - name: Ingest
        id: ingest
        env:
          # On the schedule both are empty, giving a plain gated run.
          FORCE: ${{ inputs.force && '--force' || '' }}
          FLAGS: ${{ inputs.flags }}
          VPS_TARGET: deploy@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$FORCE" ] && args+=("$FORCE")
          # FLAGS is free text from the Run-workflow form: split on spaces into
          # separate words (never eval'd), each of which becomes one argument to
          # seed.py inside the ingest container.
          if [ -n "$FLAGS" ]; then
            read -r -a seed <<< "$FLAGS"
            args+=(-- "${seed[@]}")
          fi
          ./scripts/vps-ingest.sh "${args[@]}"

      # Lap times and qualifying sectors are not part of the run above and never
      # can be: Formula 1 answers livetiming.formula1.com with a 403 for the
      # server's IP and for GitHub's runners alike (measured — see
      # docs/DEPLOYMENT.md). They are fetched by hand from a machine on a
      # residential connection, with `pnpm fastf1`. Since nothing
      # schedules that, this is the reminder that it is due — the ingest itself
      # has already succeeded, so a failure here must not fail the run.
      - name: Report the Fast-F1 backlog
        if: always() && steps.ingest.outcome == 'success'
        continue-on-error: true
        env:
          VPS_TARGET: deploy@${{ secrets.VPS_HOST }}
        run: |
          set -uo pipefail
          source scripts/lib/vps.sh

          # The status script prints one JSON line on stdout; progress goes to
          # stderr. Take the last line starting with `{` in case anything else
          # narrates on stdout.
          status=$(vps_task job python scripts/fastf1_status.py --limit 200 </dev/null 2>/dev/null \
                   | grep '^{' | tail -1) || true

          if [ -z "$status" ]; then
            echo "Could not read the Fast-F1 backlog."
            exit 0
          fi

          count=$(printf '%s' "$status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')

          {
            echo "### Fast-F1 backlog"
            echo ""
            if [ "$count" = "0" ]; then
              echo "Nothing missing — every race since 2018 has its lap times and qualifying sectors."
            else
              echo "**$count race(s)** are missing lap times or qualifying sectors."
              echo ""
              echo 'Formula 1 blocks this server and GitHub'"'"'s runners, so fetch them from a laptop (VPS_HOST in .env):'
              echo ""
              echo '```bash'
              echo 'pnpm fastf1'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$count race(s) missing Fast-F1 data"
