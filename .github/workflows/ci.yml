name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipeline

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1tracker
          POSTGRES_PASSWORD: f1tracker_dev
          POSTGRES_DB: f1tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Security audit
        run: uv run pip-audit
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://f1tracker:f1tracker_dev@localhost:5432/f1tracker
        run: uv run pytest -v

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The VPS deploy builds this image; catch a broken Dockerfile here rather
      # than on the server.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: pipeline
          file: pipeline/Dockerfile
          push: false
          load: true
          tags: f1-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm f1-tracker-api:ci python -c "import src.api.main; print('app imports OK')"
          docker run --rm --entrypoint alembic f1-tracker-api:ci --version
