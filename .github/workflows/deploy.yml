# Deploys the F1 Tracker backend to the VPS. The frontend is not touched here —
# Vercel builds that from the same push.
#
# The image is built and pushed to GHCR by this job; the server pulls it with its
# own stored GHCR credentials. Nothing is built on the box, and no registry
# credentials are passed to it.
#
# Repository secrets required:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   join the tailnet as tag:ci
#   VPS_HOST                               the server's tailnet IP (100.x.y.z)
#
# There is deliberately NO SSH key here. The server runs Tailscale SSH, which
# owns port 22 on the tailnet address and authenticates by tailnet identity
# rather than authorized_keys — so a key would be ignored. What grants access is
# the `ssh` rule in the tailnet policy file saying tag:ci may SSH to tag:server
# as hugo. Revoking CI is editing that rule or deleting the OAuth client.
name: deploy

on:
  push:
    # This repository's default branch is master, not main.
    branches: [master]
    # Backend paths only: a frontend-only push is Vercel's business and should
    # not churn the API container.
    paths:
      - 'pipeline/**'
      - 'docker/compose.prod.yml'
      - 'scripts/vps/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      ingest:
        description: 'Run an ingest after deploying (ignores the calendar gate)'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a deploy in flight — a half-applied migration or a partial
  # `up` is worse than waiting for the previous run to finish.
  cancel-in-progress: false

env:
  # Must match the name passed to new-app.sh: it is the container name, the
  # compose project, the database and the GHCR image name.
  APP_NAME: f1_api
  APP_DIR: /srv/apps/f1_api

# Action versions are pinned to the majors this repository's ci.yml already runs
# green (checkout@v5, setup-buildx@v3, build-push@v6), not the newer ones in the
# platform's template. A tag that does not exist fails the deploy with a confusing
# error; bump these only after confirming the release exists.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native amd64 build. No QEMU, no multi-arch: the runner and the VPS are
      # the same architecture.
      #
      # The build context is pipeline/, not the repository root: this is a
      # monorepo whose root holds the Next.js frontend, and the backend image
      # must not carry it. pipeline/Dockerfile expects that context.
      - uses: docker/build-push-action@v6
        with:
          context: pipeline
          file: pipeline/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Joins the tailnet as an ephemeral node tagged tag:ci, which is the
      # identity the server's SSH policy accepts. The node is removed when the
      # job ends.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The tailscale action retries a failed `tailscale up` and then exits 0
      # anyway, so a bad OAuth client surfaces two steps later as an SSH
      # connection timeout that says nothing about the real cause. Fail here
      # instead, while the reason is still on screen.
      - name: Verify the tailnet join
        run: |
          if ! tailscale status; then
            echo "::error::Not on the tailnet, so the deploy cannot reach the" \
                 "server. Check TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET, that the" \
                 "OAuth client carries the auth_keys scope, and that it owns" \
                 "tag:ci — which must also exist in the policy file's tagOwners."
            exit 1
          fi

      # StrictHostKeyChecking=accept-new is effectively `no` here: every run gets
      # a fresh runner with an empty known_hosts, so there is never a stored key
      # to compare against. That is acceptable ONLY because the connection rides
      # inside WireGuard between two authenticated tailnet peers. Do not carry
      # this into a deploy that reaches a host over the public internet.
      #
      # The stack definition lives in this repository rather than being
      # hand-maintained on the box, so it is shipped here before anything runs.
      # It is written as docker-compose.yml — the name new-app.sh uses — so the
      # app directory holds exactly one compose file and the platform's own
      # runbook commands address the same stack this deploy does.
      # Written to a temp file and moved into place, so a truncated transfer
      # cannot leave a half-written compose file behind.
      - name: Ship the stack definition
        env:
          SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
        run: |
          set -euo pipefail
          target="hugo@${{ secrets.VPS_HOST }}"

          ssh $SSH_OPTS "$target" \
            "cat > '$APP_DIR/docker-compose.yml.tmp'" < docker/compose.prod.yml
          ssh $SSH_OPTS "$target" \
            "cat > '$APP_DIR/ingest.sh.tmp'" < scripts/vps/ingest.sh
          # fastf1.sh loads session data fetched off-box (Formula 1 blocks the
          # server's IP); purge-cache.sh is the Vercel purge both scripts share.
          ssh $SSH_OPTS "$target" \
            "cat > '$APP_DIR/fastf1.sh.tmp'" < scripts/vps/fastf1.sh
          ssh $SSH_OPTS "$target" \
            "cat > '$APP_DIR/purge-cache.sh.tmp'" < scripts/vps/purge-cache.sh
          # backup.sh dumps the production database to stdout. It is the only
          # place the Fast-F1 data can be dumped from, since payloads are
          # imported straight into production.
          ssh $SSH_OPTS "$target" \
            "cat > '$APP_DIR/backup.sh.tmp'" < scripts/vps/backup.sh

          ssh $SSH_OPTS "$target" bash -s <<REMOTE
          set -euo pipefail
          mv "$APP_DIR/docker-compose.yml.tmp" "$APP_DIR/docker-compose.yml"
          mv "$APP_DIR/ingest.sh.tmp"          "$APP_DIR/ingest.sh"
          mv "$APP_DIR/fastf1.sh.tmp"          "$APP_DIR/fastf1.sh"
          mv "$APP_DIR/purge-cache.sh.tmp"     "$APP_DIR/purge-cache.sh"
          mv "$APP_DIR/backup.sh.tmp"          "$APP_DIR/backup.sh"
          chmod +x "$APP_DIR/ingest.sh" "$APP_DIR/fastf1.sh" \
                   "$APP_DIR/purge-cache.sh" "$APP_DIR/backup.sh"
          REMOTE

      - name: Deploy over Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "hugo@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /srv/apps/f1_api
          echo "TAG=${{ github.sha }}" > .tag

          dc() { docker compose --env-file .env --env-file .tag "$@"; }

          # The server pulls with its own stored GHCR credentials. Nothing is
          # passed from here.
          dc pull

          # Schema first, and against DIRECT_URL — PgBouncer's transaction
          # pooling cannot run a migration. `run --rm` rather than a startup
          # hook, so a failed migration fails the deploy instead of leaving the
          # API crash-looping against a half-migrated database.
          #
          # </dev/null is load-bearing. This whole script arrives on the SSH
          # session's stdin, and `compose run` and `compose exec` both attach
          # stdin — so without it they swallow the remaining lines, bash never
          # runs them, and the deploy exits 0 having only migrated. That failed
          # silently for four deploys: the API container was never created and
          # the health check below never executed.
          dc run --rm -T migrate </dev/null

          # --wait blocks on the healthcheck, so a broken image fails the
          # workflow instead of quietly sitting there crash-looping.
          dc up -d --wait

          # Liveness got us this far; confirm the API can actually reach
          # PostgreSQL before calling the deploy good.
          dc exec -T f1_api curl -fsS http://127.0.0.1:8000/api/health/db </dev/null

          # Belt and braces against the above ever regressing: assert the API
          # container is actually running. A deploy that reports success while
          # having started nothing is worse than one that fails.
          dc ps --status running --services | grep -qx f1_api

          docker image prune -f
          REMOTE

      # Opt-in from the "Run workflow" button. The scheduled path is
      # f1-tracker-ingest.timer on the server; this is the manual override, so it
      # skips the calendar gate. Ingesting a race weekend pulls the f1db release
      # and Fast-F1 sessions, which is slow — hence the long timeout upstream.
      - name: Ingest
        if: inputs.ingest
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "hugo@${{ secrets.VPS_HOST }}" \
              "/srv/apps/f1_api/ingest.sh --force"
